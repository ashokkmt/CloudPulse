services:
  backend:
    image: registry.digitalocean.com/cloudpulse-registry/backend:${APP_VERSION:-latest}
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env.production

  worker:
    image: registry.digitalocean.com/cloudpulse-registry/worker:${APP_VERSION:-latest}
    restart: unless-stopped
    env_file:
      - .env.production

  frontend:
    image: registry.digitalocean.com/cloudpulse-registry/frontend:${APP_VERSION:-latest}
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env.frontend

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    ports:
      - "9100:9100"
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    privileged: true
    restart: unless-stopped

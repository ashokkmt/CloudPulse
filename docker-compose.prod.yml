services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    expose:
      - "6379"

  backend:
    image: registry.digitalocean.com/cloudpulse-registry/backend:v2
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    image: registry.digitalocean.com/cloudpulse-registry/worker:v1
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  simulator:
    image: registry.digitalocean.com/cloudpulse-registry/simulator:v1
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - backend

  frontend:
    image: registry.digitalocean.com/cloudpulse-registry/frontend:v2
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      - backend

volumes:
  postgres_data:
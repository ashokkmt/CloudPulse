global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - 'rules.yml'

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'app'
    static_configs:
      - targets: 
        - '10.106.0.2:8000'
        - '10.106.0.7:8000'

  - job_name: 'node'
    static_configs:
      - targets:
        - '10.106.0.2:9100'
        - '10.106.0.7:9100'

  - job_name: 'cadvisor'
    static_configs:
      - targets:
        - '10.106.0.2:8080'
        - '10.106.0.7:8080'